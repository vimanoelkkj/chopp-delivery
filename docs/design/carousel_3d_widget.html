<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
  <style>
    .font-display { font-family: 'Big Shoulders Display', sans-serif; }
    .font-mono { font-family: 'IBM Plex Mono', monospace; }
    
    .carousel-stage {
      perspective: 900px;
      perspective-origin: 50% 50%;
    }
    .keg-slide {
      transition: all 0.5s cubic-bezier(0.2, 0.9, 0.3, 1);
      backface-visibility: hidden;
      transform-style: preserve-3d;
      will-change: transform, opacity;
    }
    .pos-center {
      transform: translate3d(0, 0, 40px) scale(1) rotateY(0deg);
      z-index: 20;
      opacity: 1;
      filter: drop-shadow(0 15px 25px rgba(0,0,0,0.85)) drop-shadow(0 0 25px rgba(216,139,54,0.3));
    }
    .pos-left {
      transform: translate3d(-180px, 15px, -60px) scale(0.78) rotateY(20deg);
      z-index: 10;
      opacity: 0.5;
      filter: brightness(0.6) blur(0.5px);
      cursor: pointer;
    }
    .pos-right {
      transform: translate3d(180px, 15px, -60px) scale(0.78) rotateY(-20deg);
      z-index: 10;
      opacity: 0.5;
      filter: brightness(0.6) blur(0.5px);
      cursor: pointer;
    }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-2">
  <div class="bg-[#101713] text-[#F5F0E6] border border-[#253229] rounded-2xl p-4 shadow-2xl overflow-hidden max-w-[620px] mx-auto">
    
    <!-- Header do Widget -->
    <div class="flex items-center justify-between border-b border-[#253229] pb-2 mb-2">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-[#D88B36] animate-pulse"></span>
        <h3 class="font-display text-lg tracking-wider uppercase text-white font-black">
          CARROSSEL 3D &bull; BARRIS PROTAGONISTAS
        </h3>
      </div>
      <span class="text-[10px] font-mono uppercase bg-[#19251D] px-2 py-0.5 rounded text-[#C6A46A] border border-[#C6A46A]/20">
        CSS 3D Engine
      </span>
    </div>

    <!-- Palco 3D -->
    <div class="carousel-stage relative h-[240px] flex items-center justify-center overflow-hidden my-1">
      
      <!-- Barril 0: Palato Beber -->
      <div id="w-keg-0" class="keg-slide absolute w-[170px] h-[220px] rounded-xl bg-[#141b16] border border-[#253229] p-2 flex flex-col items-center justify-between" onclick="rotateTo(0)">
        <span class="text-[9px] font-mono text-[#C6A46A] uppercase">30L / 50L</span>
        <img src="barril_chopp_30l_studio_1793304022404.jpg" alt="Barril Palato Beber" class="h-[130px] object-contain">
        <div class="text-center w-full">
          <p class="font-display text-base font-bold text-white uppercase leading-none">Palato Beber</p>
          <p class="text-[10px] font-mono text-[#C6A46A]">R$ 490 / R$ 640</p>
        </div>
      </div>

      <!-- Barril 1: Dronken (Center) -->
      <div id="w-keg-1" class="keg-slide absolute w-[170px] h-[220px] rounded-xl bg-[#19251D] border border-[#C6A46A]/60 p-2 flex flex-col items-center justify-between" onclick="rotateTo(1)">
        <span class="text-[9px] font-mono text-[#D88B36] font-bold uppercase">&bull; Mais Pedido</span>
        <img src="craft_beer_keg_hero_1793303975353.jpg" alt="Barril Dronken" class="h-[130px] object-contain">
        <div class="text-center w-full">
          <p class="font-display text-base font-bold text-white uppercase leading-none">Dronken</p>
          <p class="text-[10px] font-mono text-[#C6A46A] font-bold">R$ 510 / R$ 650</p>
        </div>
      </div>

      <!-- Barril 2: Villa Alemã -->
      <div id="w-keg-2" class="keg-slide absolute w-[170px] h-[220px] rounded-xl bg-[#141b16] border border-[#253229] p-2 flex flex-col items-center justify-between" onclick="rotateTo(2)">
        <span class="text-[9px] font-mono text-[#C6A46A] uppercase">30L / 50L</span>
        <img src="barril_chopp_30l_studio_1793304022404.jpg" alt="Barril Villa Alemã" class="h-[130px] object-contain scale-x-[-1]">
        <div class="text-center w-full">
          <p class="font-display text-base font-bold text-white uppercase leading-none">Villa Alemã</p>
          <p class="text-[10px] font-mono text-[#C6A46A]">R$ 520 / R$ 670</p>
        </div>
      </div>

    </div>

    <!-- Controles Rápidos -->
    <div class="flex items-center justify-between pt-2 border-t border-[#253229] text-xs">
      <button onclick="prev()" class="px-3 py-1 rounded bg-[#19251D] hover:bg-[#253229] text-white font-mono text-[11px] flex items-center gap-1 transition">
        &larr; Anterior
      </button>

      <div class="text-center font-mono text-[11px] text-[#B4B8AF]">
        Barril Inox &bull; <span id="w-label" class="text-[#C6A46A] font-bold">Dronken Double</span>
      </div>

      <button onclick="next()" class="px-3 py-1 rounded bg-[#19251D] hover:bg-[#253229] text-white font-mono text-[11px] flex items-center gap-1 transition">
        Próximo &rarr;
      </button>
    </div>

  </div>

  <script>
    let cur = 1;
    const names = ["Palato Beber (Pilsen)", "Dronken (Double Double)", "Villa Alemã (Tradicional)"];
    function sync() {
      const k0 = document.getElementById('w-keg-0');
      const k1 = document.getElementById('w-keg-1');
      const k2 = document.getElementById('w-keg-2');
      const lbl = document.getElementById('w-label');
      
      [k0, k1, k2].forEach(k => k.className = 'keg-slide absolute w-[170px] h-[220px] rounded-xl border p-2 flex flex-col items-center justify-between');

      if (cur === 0) {
        k0.classList.add('pos-center', 'bg-[#19251D]', 'border-[#C6A46A]/60');
        k1.classList.add('pos-right', 'bg-[#141b16]', 'border-[#253229]');
        k2.classList.add('pos-left', 'bg-[#141b16]', 'border-[#253229]');
      } else if (cur === 1) {
        k1.classList.add('pos-center', 'bg-[#19251D]', 'border-[#C6A46A]/60');
        k0.classList.add('pos-left', 'bg-[#141b16]', 'border-[#253229]');
        k2.classList.add('pos-right', 'bg-[#141b16]', 'border-[#253229]');
      } else {
        k2.classList.add('pos-center', 'bg-[#19251D]', 'border-[#C6A46A]/60');
        k1.classList.add('pos-left', 'bg-[#141b16]', 'border-[#253229]');
        k0.classList.add('pos-right', 'bg-[#141b16]', 'border-[#253229]');
      }
      lbl.innerText = names[cur];
    }
    function prev() { cur = (cur + 2) % 3; sync(); }
    function next() { cur = (cur + 1) % 3; sync(); }
    function rotateTo(idx) { cur = idx; sync(); }
    sync();
  </script>
</body>
</html>
